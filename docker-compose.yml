services:
  mongodb:
    image: mongo:7-jammy
    container_name: medcore_mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_DATABASE: medcore_hms
    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: medcore_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

  api:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    container_name: medcore_api
    restart: unless-stopped
    ports:
      - '3001:3001'
    environment:
      - PORT=3001
      - MONGODB_URI=mongodb://mongodb:27017/medcore_hms
      - REDIS_URL=redis://redis:6379
    depends_on:
      - mongodb
      - redis
    env_file:
      - .env

  frontend:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
    container_name: medcore_frontend
    restart: unless-stopped
    ports:
      - '3000:3000'
    depends_on:
      - api
    env_file:
      - .env

volumes:
  mongodb_data:
  redis_data:
